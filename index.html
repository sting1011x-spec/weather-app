<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>天気予報</title>
<style>
  /* 全体の基本設定 */
  body {
    font-family: sans-serif;
    background-color: #f5f5f5;
    margin: 0;
    padding: 4px;
    color: #333;
    overflow-x: hidden;
  }
  
  /* メイン画面のスタイル */
  h1 {
    font-size: 16px;
    margin: 2px 0 4px 0;
    border-bottom: 1px solid #ccc;
    padding-bottom: 4px;
    font-weight: normal;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header-btn { font-size: 18px; cursor: pointer; padding: 0 5px; }
  
  /* ▼▼ 今回修整した箇所（サイズ拡大） ▼▼ */
  .date-title { font-size: 16px; margin: 8px 0 4px; font-weight: bold; color: #111; }
  table { width: 100%; border-collapse: collapse; background-color: #fff; margin-bottom: 8px; text-align: center; font-size: 13px; }
  th, td { border: 1px solid #c0c0c0; padding: 2px 1px; width: 12.5%; vertical-align: middle; line-height: 1.2; }
  th { background-color: #f0f0ff; font-weight: bold; padding: 4px 1px; font-size: 14px; }
  .icon { font-size: 24px; margin-bottom: 2px; }
  .small-text { font-size: 12px; }
  /* ▲▲ ここまで ▲▲ */
  
  .temp { color: #d9534f; }
  .humidity { color: #5cb85c; }
  .weekly-temp-max { color: #d9534f; }
  .weekly-temp-min { color: #007bff; }
  
  .btn {
    padding: 6px 16px; background-color: #e0e0e0; border: 1px solid #ccc;
    border-radius: 4px; font-size: 13px; text-align: center; display: inline-block; cursor: pointer;
  }

  /* 設定画面用の追加スタイル */
  #settings-view {
    display: none;
    background-color: #f5f5f5;
    position: absolute;
    top: 0; left: 0;
    width: 100%; min-height: 100vh;
    box-sizing: border-box;
    padding: 4px;
    z-index: 10;
  }
  .search-box {
    display: flex; margin-bottom: 15px; border-bottom: 2px solid #008080; padding-bottom: 5px;
  }
  .search-box input {
    flex: 1; border: none; outline: none; font-size: 16px; padding: 5px; background-color: transparent;
  }
  .search-box button {
    background-color: #f0f0f0; border: 1px solid #ccc; padding: 5px 15px; border-radius: 4px;
  }
  .list-title {
    font-size: 12px; color: #666; margin-top: 15px; margin-bottom: 5px; border-bottom: 1px solid #ddd; padding-bottom: 2px;
  }
  .list-item {
    padding: 12px 5px; border-bottom: 1px solid #eee; font-size: 15px; cursor: pointer; background-color: #fff;
  }
</style>
</head>
<body>

<!-- メイン画面（天気予報） -->
<div id="main-view">
  <h1>
    <span id="location-name">日立市 の天気</span>
    <span class="header-btn" onclick="openSettings()">⋮</span>
  </h1>
  <div id="weather-container">気象データを読み込んでいます...</div>
  
  <div style="text-align: center; margin-top: 10px; padding-bottom: 20px;">
    <div class="btn" onclick="fetchWeather()">更新</div>
    <div class="btn" onclick="openSettings()" style="margin-left: 10px;">地域変更</div>
  </div>
</div>

<!-- 設定画面（地域検索・履歴） -->
<div id="settings-view">
  <h1 style="border-bottom: none; margin-bottom: 10px;">
    <span class="header-btn" onclick="closeSettings()" style="margin-right: 10px;">←</span> 地域設定
  </h1>
  
  <div class="search-box">
    <input type="text" id="search-input" placeholder="郵便番号または地名">
    <button onclick="searchLocation()">検索</button>
  </div>
  
  <!-- 検索結果エリア -->
  <div id="search-results-container" style="display:none;">
    <div class="list-title">検索結果</div>
    <div id="search-results"></div>
  </div>

  <!-- 履歴エリア -->
  <div class="list-title">履歴</div>
  <div id="history-list"></div>
</div>

<script>
  // WMO天気コード変換
  function getWeatherInfo(code) {
    if (code === 0) return { icon: "☀️", text: "晴れ" };
    if (code === 1 || code === 2) return { icon: "🌤️", text: "晴れ" };
    if (code === 3) return { icon: "☁️", text: "曇り" };
    if (code >= 45 && code <= 48) return { icon: "🌫️", text: "霧" };
    if (code >= 51 && code <= 67) return { icon: "☔", text: "雨" };
    if (code >= 71 && code <= 77) return { icon: "⛄", text: "雪" };
    if (code >= 80 && code <= 82) return { icon: "🌧️", text: "雨" };
    if (code >= 85 && code <= 86) return { icon: "⛄", text: "雪" };
    if (code >= 95) return { icon: "⚡", text: "雷雨" };
    return { icon: "❓", text: "不明" };
  }

  function getWindDir(degree) {
    const dirs = ["北", "北北東", "北東", "東北東", "東", "東南東", "南東", "南南東", "南", "南南西", "南西", "西南西", "西", "西北西", "北西", "北北西"];
    return dirs[Math.round(degree / 22.5) % 16];
  }

  const days = ["日", "月", "火", "水", "木", "金", "土"];

  // 状態管理（現在地と履歴）
  let currentLocation = { name: "日立市", lat: 36.59, lon: 140.66 };
  let historyList = [];

  function loadData() {
    const savedLoc = localStorage.getItem('weather_current_location');
    if (savedLoc) currentLocation = JSON.parse(savedLoc);
    
    const savedHist = localStorage.getItem('weather_history');
    if (savedHist) historyList = JSON.parse(savedHist);
    else historyList = [currentLocation];
  }

  function saveData() {
    localStorage.setItem('weather_current_location', JSON.stringify(currentLocation));
    localStorage.setItem('weather_history', JSON.stringify(historyList));
  }

  function selectLocation(name, lat, lon) {
    currentLocation = { name, lat, lon };
    
    historyList = historyList.filter(item => item.name !== name);
    historyList.unshift(currentLocation);
    if (historyList.length > 10) historyList.pop();
    
    saveData();
    closeSettings();
    fetchWeather();
  }

  // 天気APIの取得と表示
  async function fetchWeather() {
    document.getElementById("location-name").innerText = currentLocation.name + " の天気";
    document.getElementById("weather-container").innerText = "気象データを読み込んでいます...";
    
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${currentLocation.lat}&longitude=${currentLocation.lon}&hourly=weathercode,temperature_2m,relativehumidity_2m,precipitation,windspeed_10m,winddirection_10m&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=8`;
      const res = await fetch(url);
      const data = await res.json();
      renderWeather(data);
    } catch (e) {
      document.getElementById("weather-container").innerText = "天気の取得に失敗しました。ネットワークを確認してください。";
    }
  }

  function renderWeather(data) {
    let html = "";
    
    for (let dayOffset = 0; dayOffset <= 1; dayOffset++) {
      const dateStr = data.hourly.time[dayOffset * 24];
      const dateObj = new Date(dateStr);
      const displayDate = `${dateObj.getMonth() + 1}月${dateObj.getDate()}日(${days[dateObj.getDay()]})`;
      
      html += `<div class="date-title">${displayDate}</div><table><tr>`;
      for (let i = 0; i < 24; i += 3) html += `<th>${i}</th>`;
      html += `</tr><tr>`;
      for (let i = 0; i < 24; i += 3) {
        const w = getWeatherInfo(data.hourly.weathercode[dayOffset * 24 + i]);
        html += `<td><div class="icon">${w.icon}</div><div class="small-text">${w.text}</div></td>`;
      }
      html += `</tr><tr>`;
      for (let i = 0; i < 24; i += 3) html += `<td class="temp">${Math.round(data.hourly.temperature_2m[dayOffset * 24 + i])}</td>`;
      html += `</tr><tr>`;
      for (let i = 0; i < 24; i += 3) html += `<td class="humidity">${data.hourly.relativehumidity_2m[dayOffset * 24 + i]}</td>`;
      html += `</tr><tr>`;
      for (let i = 0; i < 24; i += 3) html += `<td>${data.hourly.precipitation[dayOffset * 24 + i]}</td>`;
      html += `</tr><tr>`;
      for (let i = 0; i < 24; i += 3) {
        const windDir = getWindDir(data.hourly.winddirection_10m[dayOffset * 24 + i]);
        const windSpeed = Math.round(data.hourly.windspeed_10m[dayOffset * 24 + i] / 3.6);
        html += `<td><div class="small-text">${windDir}<br>${windSpeed}</div></td>`;
      }
      html += `</tr></table>`;
    }

    html += `<div class="date-title">週間天気</div><table><tr>`;
    for (let i = 2; i <= 7; i++) {
      const d = new Date(data.daily.time[i]);
      html += `<th>${d.getDate()}日<br>(${days[d.getDay()]})</th>`;
    }
    html += `</tr><tr>`;
    for (let i = 2; i <= 7; i++) {
      const w = getWeatherInfo(data.daily.weathercode[i]);
      html += `<td><div class="icon">${w.icon}</div><div class="small-text">${w.text}</div></td>`;
    }
    html += `</tr><tr>`;
    for (let i = 2; i <= 7; i++) {
      html += `<td><span class="weekly-temp-max">${Math.round(data.daily.temperature_2m_max[i])}</span>/<span class="weekly-temp-min">${Math.round(data.daily.temperature_2m_min[i])}</span></td>`;
    }
    html += `</tr><tr>`;
    for (let i = 2; i <= 7; i++) {
      const pop = data.daily.precipitation_probability_max[i] || 0;
      html += `<td>${pop}</td>`;
    }
    html += `</tr></table>`;

    document.getElementById("weather-container").innerHTML = html;
  }

  // 地名検索（正規化対応版）
  async function searchLocation() {
    const query = document.getElementById("search-input").value;
    if (!query) return;

    const resultsContainer = document.getElementById("search-results");
    resultsContainer.innerHTML = "検索中...";
    document.getElementById("search-results-container").style.display = "block";

    try {
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&addressdetails=1`;
      const res = await fetch(url);
      const data = await res.json();

      if (!data || data.length === 0) {
        resultsContainer.innerHTML = "<div class='list-item'>見つかりませんでした。別の地名をお試しください。</div>";
        return;
      }

      let html = "";
      const limit = Math.min(data.length, 5);
      for(let i = 0; i < limit; i++) {
        const item = data[i];
        const address = item.address || {};
        
        const pref = address.province || address.state || "";
        const city = address.city || address.town || address.village || address.borough || address.ward || address.county || "";
        const name = item.name || ""; 

        let shortName = "";
        if (name && name !== pref && name !== city) {
          shortName = pref ? `${pref} ${name}` : name;
        } else {
          shortName = (pref && city && pref !== city) ? `${pref}${city}` : (pref || city || name);
        }

        const fullAddress = item.display_name.replace(/,\s*日本$/, "");
        
        html += `
          <div class="list-item" onclick="selectLocation('${shortName}', ${item.lat}, ${item.lon})">
            <div style="font-size: 15px;">${shortName}</div>
            <div style="font-size: 11px; color: #888; margin-top: 2px;">${fullAddress}</div>
          </div>
        `;
      }
      resultsContainer.innerHTML = html;
    } catch (e) {
      resultsContainer.innerHTML = "<div class='list-item'>検索エラーが発生しました。</div>";
    }
  }

  function openSettings() {
    document.getElementById("main-view").style.display = "none";
    document.getElementById("settings-view").style.display = "block";
    renderHistory();
  }

  function closeSettings() {
    document.getElementById("settings-view").style.display = "none";
    document.getElementById("main-view").style.display = "block";
    document.getElementById("search-results-container").style.display = "none";
    document.getElementById("search-input").value = "";
  }

  function renderHistory() {
    let html = "";
    historyList.forEach(item => {
      html += `<div class="list-item" onclick="selectLocation('${item.name}', ${item.lat}, ${item.lon})">${item.name}</div>`;
    });
    document.getElementById("history-list").innerHTML = html;
  }

  loadData();
  fetchWeather();
</script>

</body>
</html>
