<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日立市の天気</title>
<style>
  /* 縦幅に収まるよう余白と文字サイズを極力小さく調整 */
  body {
    font-family: sans-serif;
    background-color: #f5f5f5;
    margin: 0;
    padding: 4px; 
    color: #333;
  }
  h1 {
    font-size: 16px;
    margin: 2px 0 4px 0;
    border-bottom: 1px solid #ccc;
    padding-bottom: 4px;
    font-weight: normal;
  }
  .date-title {
    font-size: 13px;
    margin: 4px 0 2px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background-color: #fff;
    margin-bottom: 6px; 
    text-align: center;
    font-size: 12px;
  }
  th, td {
    border: 1px solid #c0c0c0;
    padding: 2px 1px; 
    width: 12.5%;
    vertical-align: middle;
    line-height: 1.1; 
  }
  th {
    background-color: #f0f0ff;
    font-weight: normal;
    padding: 3px 1px;
  }
  .temp { color: #d9534f; } 
  .humidity { color: #5cb85c; } 
  .weekly-temp-max { color: #d9534f; }
  .weekly-temp-min { color: #007bff; }
  .icon { font-size: 18px; margin-bottom: 0; }
  .small-text { font-size: 10px; }
</style>
</head>
<body>

<h1>日立市 の天気</h1>
<div id="weather-container">気象データを読み込んでいます...</div>

<script>
  const lat = 36.59;
  const lon = 140.66;

  function getWeatherInfo(code) {
    if (code === 0) return { icon: "☀️", text: "晴れ" };
    if (code === 1 || code === 2) return { icon: "🌤️", text: "晴れ" };
    if (code === 3) return { icon: "☁️", text: "曇り" };
    if (code >= 45 && code <= 48) return { icon: "🌫️", text: "霧" };
    if (code >= 51 && code <= 67) return { icon: "☔", text: "雨" };
    if (code >= 71 && code <= 77) return { icon: "⛄", text: "雪" };
    if (code >= 80 && code <= 82) return { icon: "🌧️", text: "雨" };
    if (code >= 85 && code <= 86) return { icon: "⛄", text: "雪" };
    if (code >= 95) return { icon: "⚡", text: "雷雨" };
    return { icon: "❓", text: "不明" };
  }

  function getWindDir(degree) {
    const dirs = ["北", "北北東", "北東", "東北東", "東", "東南東", "南東", "南南東", "南", "南南西", "南西", "西南西", "西", "西北西", "北西", "北北西"];
    return dirs[Math.round(degree / 22.5) % 16];
  }

  const days = ["日", "月", "火", "水", "木", "金", "土"];

  async function fetchWeather() {
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=weathercode,temperature_2m,relativehumidity_2m,precipitation,windspeed_10m,winddirection_10m&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=8`;
      const res = await fetch(url);
      const data = await res.json();
      renderWeather(data);
    } catch (e) {
      document.getElementById("weather-container").innerText = "天気の取得に失敗しました。ネットワークを確認してください。";
    }
  }

  function renderWeather(data) {
    let html = "";
    
    for (let dayOffset = 0; dayOffset <= 1; dayOffset++) {
      const dateStr = data.hourly.time[dayOffset * 24];
      const dateObj = new Date(dateStr);
      const displayDate = `${dateObj.getMonth() + 1}月${dateObj.getDate()}日(${days[dateObj.getDay()]})`;
      
      html += `<div class="date-title">${displayDate}</div>`;
      html += `<table><tr>`;
      
      for (let i = 0; i < 24; i += 3) html += `<th>${i}</th>`;
      html += `</tr><tr>`;
      
      for (let i = 0; i < 24; i += 3) {
        const idx = dayOffset * 24 + i;
        const w = getWeatherInfo(data.hourly.weathercode[idx]);
        html += `<td><div class="icon">${w.icon}</div><div class="small-text">${w.text}</div></td>`;
      }
      html += `</tr><tr>`;
      
      for (let i = 0; i < 24; i += 3) {
        const idx = dayOffset * 24 + i;
        html += `<td class="temp">${Math.round(data.hourly.temperature_2m[idx])}</td>`;
      }
      html += `</tr><tr>`;
      
      for (let i = 0; i < 24; i += 3) {
        const idx = dayOffset * 24 + i;
        html += `<td class="humidity">${data.hourly.relativehumidity_2m[idx]}</td>`;
      }
      html += `</tr><tr>`;
      
      for (let i = 0; i < 24; i += 3) {
        const idx = dayOffset * 24 + i;
        html += `<td>${data.hourly.precipitation[idx]}</td>`;
      }
      html += `</tr><tr>`;
      
      for (let i = 0; i < 24; i += 3) {
        const idx = dayOffset * 24 + i;
        const windDir = getWindDir(data.hourly.winddirection_10m[idx]);
        const windSpeed = Math.round(data.hourly.windspeed_10m[idx] / 3.6);
        html += `<td><div class="small-text">${windDir}<br>${windSpeed}</div></td>`;
      }
      html += `</tr></table>`;
    }

    html += `<div class="date-title">週間天気</div>`;
    html += `<table><tr>`;
    
    for (let i = 2; i <= 7; i++) {
      const d = new Date(data.daily.time[i]);
      html += `<th>${d.getDate()}日<br>(${days[d.getDay()]})</th>`;
    }
    html += `</tr><tr>`;
    
    for (let i = 2; i <= 7; i++) {
      const w = getWeatherInfo(data.daily.weathercode[i]);
      html += `<td><div class="icon">${w.icon}</div><div class="small-text">${w.text}</div></td>`;
    }
    html += `</tr><tr>`;
    
    for (let i = 2; i <= 7; i++) {
      html += `<td><span class="weekly-temp-max">${Math.round(data.daily.temperature_2m_max[i])}</span>/<span class="weekly-temp-min">${Math.round(data.daily.temperature_2m_min[i])}</span></td>`;
    }
    html += `</tr><tr>`;
    
    for (let i = 2; i <= 7; i++) {
      const pop = data.daily.precipitation_probability_max[i] || 0;
      html += `<td>${pop}</td>`;
    }
    html += `</tr></table>`;

    document.getElementById("weather-container").innerHTML = html;
  }

  fetchWeather();
</script>

</body>
</html>
